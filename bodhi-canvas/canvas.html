<title>Agent Graph Canvas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: app shell — top bar, left control drawer, pan/zoom SVG canvas, right inspector; drawer and inspector become sheets on phones */
:root{
  --bg:#eef1f5; --canvas:#f7f8fa; --grid:#e3e7ee; --surface:#ffffff; --surface-2:#f2f4f8;
  --fg:#18202b; --muted:#5b6676; --line:#d7dce4; --line-strong:#b8c0cc;
  --accent:#3550d6; --accent-soft:#e7ebfb; --accent-fg:#ffffff;
  --warn:#b45309; --warn-soft:#fdf1dc; --ok:#15803d; --ok-soft:#e3f4e8;
  --t-page:#3550d6; --t-component:#6a54c9; --t-function:#0f766e; --t-data:#a16207; --t-source:#6b6358;
  --t-agent:#b4235f; --t-skill:#7c3aed; --t-tool:#0369a1; --t-human:#c2410c; --t-eval:#15803d;
  --t-req:#475569; --t-story:#4338ca; --t-kpi:#9d174d; --t-metric:#0e7490; --t-test:#4d7c0f;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 14px rgba(20,30,50,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1117; --canvas:#11161e; --grid:#1b222c; --surface:#161c25; --surface-2:#1d2430;
  --fg:#e6eaf0; --muted:#98a3b3; --line:#2a3340; --line-strong:#3b4656;
  --accent:#8ea2ff; --accent-soft:#1f2848; --accent-fg:#0d1117;
  --warn:#f2b65e; --warn-soft:#352812; --ok:#5fd08a; --ok-soft:#14301f;
  --t-page:#8ea2ff; --t-component:#b3a2f5; --t-function:#4fd1c0; --t-data:#f2c25e; --t-source:#c2b8aa;
  --t-agent:#f47fae; --t-skill:#c4a5ff; --t-tool:#6cc3f5; --t-human:#ff9a5c; --t-eval:#5fd08a;
  --t-req:#aab6c8; --t-story:#a5a8ff; --t-kpi:#f58bb8; --t-metric:#5fd3e6; --t-test:#a8d65c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1117; --canvas:#11161e; --grid:#1b222c; --surface:#161c25; --surface-2:#1d2430;
  --fg:#e6eaf0; --muted:#98a3b3; --line:#2a3340; --line-strong:#3b4656;
  --accent:#8ea2ff; --accent-soft:#1f2848; --accent-fg:#0d1117;
  --warn:#f2b65e; --warn-soft:#352812; --ok:#5fd08a; --ok-soft:#14301f;
  --t-page:#8ea2ff; --t-component:#b3a2f5; --t-function:#4fd1c0; --t-data:#f2c25e; --t-source:#c2b8aa;
  --t-agent:#f47fae; --t-skill:#c4a5ff; --t-tool:#6cc3f5; --t-human:#ff9a5c; --t-eval:#5fd08a;
  --t-req:#aab6c8; --t-story:#a5a8ff; --t-kpi:#f58bb8; --t-metric:#5fd3e6; --t-test:#a8d65c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45;margin:0;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono)}
.app{height:100%;display:grid;grid-template-rows:auto 1fr}
/* top bar */
.top{display:flex;align-items:center;gap:14px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:15px;font-weight:600;white-space:nowrap}
.brand span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lifecycle{display:flex;align-items:center;gap:4px;margin-left:12px}
.ph{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.04em;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.ph.done{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:var(--ok-soft)}
.ph.now{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.ph-sep{color:var(--line-strong)}
.top .spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--line-strong)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.warnbtn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:var(--warn-soft)}
.btn.okbtn{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:var(--ok-soft)}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:34px;display:inline-grid;place-items:center;font-size:16px;line-height:1}
#menuBtn{display:none}
/* body */
.body{display:grid;grid-template-columns:272px 1fr auto;min-height:0;position:relative}
/* drawer */
.drawer{background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column;min-height:0}
.dsec{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.dlabel{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.views{display:flex;flex-direction:column;gap:2px}
.view{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:8px;text-align:left;border:0;background:transparent;border-radius:8px;padding:8px 8px}
.view:hover{background:var(--surface-2)}
.view.on{background:var(--accent-soft);color:var(--accent)}
.view .vi{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-family:var(--font-mono);font-size:11px;font-weight:500;border:1px solid currentColor}
.view .vt b{display:block;font-weight:600;font-size:13.5px}
.view .vt span{display:block;font-size:12px;color:var(--muted)}
.view .count{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.legend{display:flex;flex-direction:column;gap:2px}
.lg{display:grid;grid-template-columns:auto 12px 1fr auto;align-items:center;gap:8px;font-size:13px;padding:4px 2px;cursor:pointer}
.lg input{margin:0;accent-color:var(--accent)}
.sw{width:12px;height:12px;border-radius:3px;border:2px solid}
.lg .n{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.kb-phase{display:flex;flex-direction:column;gap:2px}
.kb-phase h4{margin:6px 0 2px;font-size:12px;font-weight:600;color:var(--fg);display:flex;gap:6px;align-items:center}
.kb-item{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;text-align:left;border:0;background:transparent;padding:5px 6px;border-radius:6px;font-size:12.5px;color:var(--fg)}
.kb-item:hover{background:var(--surface-2)}
.kb-item.on{background:var(--accent-soft)}
.kb-item i{width:8px;height:8px;border-radius:50%}
.kb-item .meta{font-family:var(--font-mono);font-size:10.5px;color:var(--muted)}
.kb-item .meta.good{color:var(--ok)}
.kb-item .meta.bad{color:var(--warn)}
.pattern{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--surface)}
.pattern:hover{border-color:var(--line-strong)}
.pattern b{font-size:13px;font-weight:600;display:flex;justify-content:space-between;gap:6px}
.pattern span{font-size:12px;color:var(--muted)}
.pill{font-family:var(--font-mono);font-size:10.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-weight:400;white-space:nowrap}
.pill.use{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:var(--ok-soft)}
/* canvas */
.stage{position:relative;min-width:0;min-height:0;background:var(--canvas);overflow:hidden}
#svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none}
#svg.panning{cursor:grabbing}
.viewhead{position:absolute;left:16px;top:14px;display:flex;flex-direction:column;gap:2px;pointer-events:none}
.viewhead b{font-size:18px;font-weight:600}
.viewhead span{font-size:12.5px;color:var(--muted);max-width:56ch}
.zoom{position:absolute;right:14px;top:14px;display:flex;gap:6px}
.tip{position:absolute;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:12px 14px 12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start}
.tip .src{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.tip p{margin:2px 0 0;font-size:13px}
.tip .bulb{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--font-mono);font-size:12px;font-weight:500}
.tip button{border:0;background:transparent;color:var(--muted);font-size:16px;line-height:1;padding:0 2px}
.colhead{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;fill:var(--muted)}
/* svg nodes */
.node{cursor:pointer}
.node rect.box{fill:var(--surface);stroke:var(--line-strong);stroke-width:1}
.node rect.chip{stroke:none}
.node text.t{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase}
.node text.l{font-family:var(--font-body);font-size:12.5px;font-weight:500;fill:var(--fg)}
.node:hover rect.box{stroke:var(--fg)}
.node.sel rect.box{stroke:var(--accent);stroke-width:2}
.node.dim,.edge.dim{opacity:.18}
.edge path.line{fill:none;stroke:var(--line-strong);stroke-width:1.5}
.edge path.hit{fill:none;stroke:transparent;stroke-width:16;cursor:pointer}
.edge:hover path.line{stroke:var(--fg)}
.edge.sel path.line{stroke:var(--accent);stroke-width:2.5}
.edge.risk path.line{stroke:var(--warn);stroke-dasharray:5 4}
.edge.guarded path.line{stroke:var(--ok)}
.edge .lbl{font-family:var(--font-mono);font-size:9.5px;fill:var(--muted)}
.badge rect{stroke-width:1}
.badge text{font-family:var(--font-mono);font-size:9.5px;font-weight:500}
.plus circle{fill:var(--surface);stroke:var(--line-strong)}
.plus text{fill:var(--muted);font-size:12px;font-family:var(--font-mono)}
.edge:hover .plus circle{stroke:var(--accent)}
.edge:hover .plus text{fill:var(--accent)}
/* inspector */
.inspector{width:360px;background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column;min-height:0}
.inspector[hidden]{display:none!important}
.ihead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;position:sticky;top:0;background:var(--surface);z-index:2}
.ihead .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ihead h2{margin:0;font-size:16px;font-weight:600;text-wrap:balance}
.ihead p{margin:0;color:var(--muted);font-size:13px}
.typechip{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid currentColor;display:inline-flex;align-self:flex-start}
.isec{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.isec h3{margin:0;font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.isec h3 .hint{font-weight:400;color:var(--muted);font-size:12px}
.isec .help{font-size:12.5px;color:var(--muted);margin:0}
.callout{border-radius:8px;padding:10px 12px;font-size:13px;display:flex;gap:8px}
.callout.warn{background:var(--warn-soft);color:var(--fg);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent)}
.callout.warn b{color:var(--warn)}
.callout.ok{background:var(--ok-soft);border:1px solid color-mix(in srgb,var(--ok) 40%,transparent)}
.callout.ok b{color:var(--ok)}
.card{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;background:var(--surface-2)}
.card .ct{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px;font-weight:600}
.card .cd{font-size:12.5px;color:var(--muted)}
.card .x{border:0;background:transparent;color:var(--muted);font-size:15px;line-height:1;padding:0 2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 6px 3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2)}
.chip .x{border:0;background:transparent;color:var(--muted);padding:0 3px;font-size:13px;line-height:1}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:1px dashed var(--line-strong);border-radius:8px;padding:10px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--muted);min-width:0}
.form .full{grid-column:1/-1}
.form select,.form input,.form textarea,.addrow select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;font-size:13px;width:100%;min-width:0}
.form textarea{resize:vertical;min-height:52px}
.addrow{display:flex;gap:6px}
.addrow select{flex:1}
.under{font-size:12px}
.under summary{cursor:pointer;color:var(--muted)}
pre.code{margin:8px 0 0;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:10px;font-family:var(--font-mono);font-size:11.5px;line-height:1.5;overflow-x:auto;white-space:pre}
.conn{display:flex;flex-direction:column;gap:2px}
.conn button{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;text-align:left;border:0;background:transparent;padding:5px 6px;border-radius:6px;font-size:12.5px}
.conn button:hover{background:var(--surface-2)}
.conn .k{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);min-width:84px}
.checks{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.checks li{display:grid;grid-template-columns:18px 1fr;gap:6px;font-size:13px}
.checks .y{color:var(--ok);font-family:var(--font-mono)}
.checks .n{color:var(--warn);font-family:var(--font-mono)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.score{font-family:var(--font-mono);font-size:22px;font-weight:500}
/* export modal */
.overlay{position:fixed;inset:0;background:rgba(10,14,20,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:min(860px,100%);max-height:min(86vh,760px);display:flex;flex-direction:column;min-height:0}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.mhead h2{margin:0;font-size:16px}
.mhead p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.tabs{display:flex;gap:4px;padding:10px 16px 0;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:8px 8px 0 0;padding:6px 12px;font-size:12.5px;border-bottom:0}
.tab.on{background:var(--surface-2);color:var(--accent);font-weight:600}
.mbody{flex:1;min-height:0;overflow:auto;border-top:1px solid var(--line);background:var(--surface-2)}
.mbody pre{margin:0;padding:14px 16px;font-family:var(--font-mono);font-size:12px;line-height:1.55;white-space:pre}
.mfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:60}
.scrim{display:none}
@media (max-width:1100px){
  .lifecycle{display:none}
  .inspector{width:320px}
}
@media (max-width:820px){
  #menuBtn{display:inline-grid}
  .body{grid-template-columns:1fr}
  .drawer{position:absolute;inset:0 auto 0 0;width:min(300px,86vw);z-index:20;box-shadow:var(--shadow);transform:translateX(-102%);transition:transform .2s ease;padding-left:env(safe-area-inset-left,0px)}
  .drawer.open{transform:none}
  .scrim.open{display:block;position:absolute;inset:0;background:rgba(10,14,20,.35);z-index:15}
  .inspector{position:absolute;left:0;right:0;bottom:0;width:auto;max-height:62%;z-index:18;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tip{right:16px;max-width:none}
  .viewhead span{display:none}
  .brand span{display:none}
  #guardBtn .lbl,#exportBtn .lbl{display:none}
}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
</style>

<div class="app">
  <header class="top">
    <button class="icon-btn" id="menuBtn" aria-label="Open canvas controls">≡</button>
    <div class="brand">
      <b>Agent Graph Canvas</b>
      <span>Plan Change Assistant · sample project</span>
    </div>
    <div class="lifecycle" aria-label="AI-DLC phase">
      <span class="ph done">Inception</span><span class="ph-sep">—</span>
      <span class="ph now">Construction · Bolt 3</span><span class="ph-sep">—</span>
      <span class="ph">Operations</span>
    </div>
    <div class="spacer"></div>
    <button class="btn warnbtn" id="guardBtn" title="Show the next connection that needs a guard"><span id="guardCount">0</span><span class="lbl">&nbsp;need a guard</span></button>
    <button class="btn primary" id="exportBtn">⇪<span class="lbl">Export graph</span></button>
  </header>

  <div class="body">
    <aside class="drawer" id="drawer" aria-label="Canvas controls">
      <div class="dsec">
        <div class="dlabel">Views</div>
        <div class="views" id="views"></div>
      </div>
      <div class="dsec">
        <div class="dlabel">On this canvas <span>show</span></div>
        <div class="legend" id="legend"></div>
      </div>
      <div class="dsec" id="patternSec">
        <div class="dlabel">Pattern palette</div>
        <div id="patterns" style="display:flex;flex-direction:column;gap:6px"></div>
      </div>
      <div class="dsec">
        <div class="dlabel">Knowledge base <span>AI-DLC</span></div>
        <div id="kb"></div>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main class="stage" id="stage">
      <svg id="svg" aria-label="Project graph canvas">
        <defs>
          <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="var(--grid)"/></pattern>
          <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--line-strong)"/></marker>
          <marker id="arrSel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker>
        </defs>
        <rect id="bg" x="-5000" y="-5000" width="10000" height="10000" fill="url(#grid)"/>
        <g id="world"></g>
      </svg>
      <div class="viewhead"><b id="vTitle"></b><span id="vSub"></span></div>
      <div class="zoom">
        <button class="icon-btn" id="zIn" aria-label="Zoom in">+</button>
        <button class="icon-btn" id="zOut" aria-label="Zoom out">−</button>
        <button class="icon-btn" id="zFit" aria-label="Fit to screen">⤢</button>
      </div>
      <div class="tip" id="tip">
        <span class="bulb">i</span>
        <div><div class="src" id="tipSrc"></div><p id="tipText"></p></div>
        <button id="tipClose" aria-label="Hide guidance">×</button>
      </div>
    </main>

    <aside class="inspector" id="inspector" hidden aria-label="Inspector"></aside>
  </div>
</div>

<div class="overlay" id="exportModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="exTitle">
    <div class="mhead">

function renderKB(){

   ['Construction',[['Agents','agent'],['Skills','skill'],['Tests','test']]],

  ];
  let h='';
  groups.forEach(([ph,sets])=>{
    h+=`<div class="kb-phase"><h4>${ph}${ph==='Construction'?` <span class="pill">${hooksCount} hooks</span>`:''}</h4>`;

      });
    });

const TIPS={
 ui:['Traceability','Every component should trace to a function, and every function to a user story. Select a node to light up its full lineage across all four views.'],
 data:['Governance','Amber dashed lines touch PHI or write to a system of record and have no guard yet. Tap one to add a hook or a human checkpoint.'],
 orch:['Building effective agents','Start with the simplest pattern that works. This flow combines routing, orchestrator-workers and a human checkpoint. Add an evaluator loop only if evals show it helps.'],
 req:['Demystifying evals','Start with 20–50 eval tasks drawn from real failures. Link each test to the function it verifies and to the eval that automates it.'],
 edge:['Hooks','Hooks run at fixed moments: before an action, after it, at a handoff, or when a task is done. Pick the moment first, then the kind of check.'],
 agent:['Multi-agent research system','Give every subagent a full brief: objective, output format, tools and boundaries. Vague briefs lead to duplicated or missed work.'],
 eval:['Demystifying evals','Grade the outcome, not the exact path. For customer-facing flows, track pass^k: the chance that every one of k runs succeeds.'],
 skill:['Agent Skills','A skill loads in stages. Only its name and description sit in context until the agent needs the full instructions. Keep the description specific.'],

function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')}
function matcherFor(e){const t=byId[e.to];if(t.type==='tool'){const [srv,fn]=t.label.split('.');return `mcp__${slug(srv)}__${slug(fn||'call')}`}if(t.type==='agent')return slug(t.label);return slug(t.label)}
function hookConfig(e){
  const out={};
  e.hooks.forEach(h=>{
    const ev=h.when==='handoff'?'SubagentStart':WHEN[h.when].ev;
    const handler={type:CHECK[h.check].h};
    if(h.check==='script')handler.command=`./hooks/${slug(ACTION[h.action])}.sh`;
    if(h.check==='human'){handler.command='./hooks/require-approval.sh';handler.statusMessage='Waiting for '+(e.checkpoint?byId[e.checkpoint].label.toLowerCase():'approval')}
    if(h.check==='llm'||h.check==='agent')handler.prompt=h.note+' Input: $ARGUMENTS';
    if(h.check==='http')handler.url='https://hooks.example.internal/'+slug(byId[e.to].label);
    const grp={hooks:[handler]};if(!['Stop','TaskCompleted'].includes(ev))grp.matcher=matcherFor(e);
    (out[ev]=out[ev]||[]).push(grp);
  });
  return {hooks:out};
}

$('patterns').onclick=ev=>{const b=ev.target.closest('[data-pattern]');if(!b)return;const p=PATTERNS[+b.dataset.pattern];TIPS._p=[p.src+' · '+p.name,p.desc];renderTip('_p')};
$('kb').onclick=ev=>{const b=ev.target.closest('[data-kb]');if(!b)return;const id=b.dataset.kb;const v=VIEWS.find(v=>v.id===S.view&&v.cols.some(c=>c[1].includes(id)))||VIEWS.find(v=>v.cols.some(c=>c[1].includes(id)));if(v&&v.id!==S.view)switchView(v.id);select('node',id);S.kbSel=id;render()};
$('guardBtn').onclick=()=>{const list=EDGES.filter(needsGuard);if(!list.length){toast('Every sensitive connection has a guard');return}const cur=S.sel&&S.sel.kind==='edge'?list.findIndex(e=>e.id===S.sel.id):-1;const e=list[(cur+1)%list.length];const v=VIEWS.find(v=>v.id===S.view&&[e.from,e.to].every(i=>v.cols.some(c=>c[1].includes(i))))||VIEWS.find(v=>[e.from,e.to].every(i=>v.cols.some(c=>c[1].includes(i))));if(v.id!==S.view)switchView(v.id);select('edge',e.id)};
$('tipClose').onclick=()=>{S.tipOff=true;$('tip').hidden=true};
$('zIn').onclick=()=>zoomBy(1.2);$('zOut').onclick=()=>zoomBy(1/1.2);$('zFit').onclick=fit;
function zoomBy(f,cx,cy){const r=svg.getBoundingClientRect();const x=S.xf[S.view];cx=cx??r.width/2;cy=cy??r.height/2;const k=Math.max(.3,Math.min(2.2,x.k*f));const wx=(cx-x.x)/x.k,wy=(cy-x.y)/x.k;x.k=k;x.x=cx-wx*k;x.y=cy-wy*k;applyXf()}
svg.addEventListener('wheel',ev=>{ev.preventDefault();const r=svg.getBoundingClientRect();zoomBy(Math.exp(-ev.deltaY*0.0015),ev.clientX-r.left,ev.clientY-r.top)},{passive:false});
let drag=null;
svg.addEventListener('pointerdown',ev=>{
  const nodeG=ev.target.closest('[data-node]'),edgeG=ev.target.closest('[data-edge]');
  const x=S.xf[S.view];
  if(nodeG){const id=nodeG.dataset.node;const p=S.pos[S.view][id];drag={mode:'node',id,sx:ev.clientX,sy:ev.clientY,ox:p.x,oy:p.y,moved:false}}
  else if(edgeG){drag={mode:'edge',id:edgeG.dataset.edge,sx:ev.clientX,sy:ev.clientY,moved:false}}
  else{drag={mode:'pan',sx:ev.clientX,sy:ev.clientY,ox:x.x,oy:x.y,moved:false};svg.classList.add('panning')}
  svg.setPointerCapture(ev.pointerId);
});
svg.addEventListener('pointermove',ev=>{
  if(!drag)return;const dx=ev.clientX-drag.sx,dy=ev.clientY-drag.sy;if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;if(!drag.moved)return;
  const x=S.xf[S.view];
  if(drag.mode==='pan'){x.x=drag.ox+dx;x.y=drag.oy+dy;applyXf()}
  else if(drag.mode==='node'){const p=S.pos[S.view][drag.id];p.x=drag.ox+dx/x.k;p.y=drag.oy+dy/x.k;render()}
});
svg.addEventListener('pointerup',ev=>{
  svg.classList.remove('panning');if(!drag)return;const d=drag;drag=null;if(d.moved)return;
  if(d.mode==='node')select('node',d.id);else if(d.mode==='edge')select('edge',d.id);else if(S.sel)closeInspector();
});
svg.addEventListener('keydown',ev=>{if(ev.key!=='Enter'&&ev.key!==' ')return;const n=ev.target.closest('[data-node]'),e=ev.target.closest('[data-edge]');if(n){ev.preventDefault();select('node',n.dataset.node)}else if(e){ev.preventDefault();select('edge',e.dataset.edge)}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){if(!$('exportModal').hidden)$('exportModal').hidden=true;else if(S.sel)closeInspector();closeDrawer()}});
function closeDrawer(){$('drawer').classList.remove('open');$('scrim').classList.remove('open')}
$('menuBtn').onclick=()=>{$('drawer').classList.add('open');$('scrim').classList.add('open')};
$('scrim').onclick=closeDrawer;
window.addEventListener('resize',()=>{clearTimeout(window.__rt);window.__rt=setTimeout(fit,120)});

render();fit();
// open with a sensitive connection selected so the core interaction is visible at rest
requestAnimationFrame(()=>{switchView('data');const e=EDGES.find(x=>x.from==='f_simulate'&&x.to==='d_members');if(window.innerWidth>820){select('edge',e.id);requestAnimationFrame(fit)}});
})();
</script>
